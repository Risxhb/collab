const hero = new THREE.Group(); hero.position.set(-4.9, 0, 5.7); hero.rotation.y = Math.PI * 0.82; scene.add(hero);
await new Promise(res => { const s = document.createElement('script'); s.src = 'vanguard-model.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
if (typeof window.buildVanguardModel === 'function') { const v = window.buildVanguardModel(M, Gl); const obj = v.root || v; obj.scale.setScalar(1.2); obj.traverse(o => { if (o.isMesh) o.castShadow = true; }); hero.add(obj); }
else add(new THREE.CapsuleGeometry(0.35, 1, 4, 12), M(0x2050cc), hero, [0, 0.85, 0]);

// ---- post: gentle bloom so brass and glows catch ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.35, 0.5, 0.92); composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---- camera ----
function frame() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h;
  if (VIEW === 'game') { camera.fov = 38; camera.position.set(0, 25.5, 19.5); camera.lookAt(0, 0, 0.8); }
  else { camera.fov = 32; const t = hero.position; camera.position.set(t.x + 0.9, 11, t.z + 7.6); camera.lookAt(t.x + 0.9, 0.5, t.z - 0.7); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame); frame();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  for (const b of banners) { const p = b.geometry.attributes.position, base = b.userData.base;
    for (let i = 0; i < p.count; i++) { const y = base[i * 3 + 1], drop = (2 - y) / 4; p.setZ(i, Math.sin(t * 1.3 + y * 1.4 + b.id) * 0.06 * drop + Math.sin(base[i * 3] * 2.5) * 0.04); }
    p.needsUpdate = true; b.geometry.computeVertexNormals(); }
  wheel.rotation.y = t * 0.03; gear.rotation.y = -t * 0.11;
  composer.render();
});
</script>
