<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Size Study</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2550; color: #f3ead6; font-family: 'Alegreya Sans', system-ui, sans-serif; }
canvas { display: block; }
#label { position: fixed; left: 24px; top: 20px; max-width: 560px; padding: 14px 18px; background: #0d1422e0; border: 1px solid #c38d4688; border-radius: 10px; font-size: 18px; line-height: 1.4; }
#label h1 { margin: 0 0 4px; font: 700 24px 'Cinzel', serif; letter-spacing: 0.06em; color: #f6c968; }
#label ul { margin: 6px 0 0; padding-left: 20px; }
#key { position: fixed; right: 24px; bottom: 20px; padding: 10px 14px; background: #0d1422e0; border: 1px solid #c38d4688; border-radius: 10px; font-size: 16px; line-height: 1.6; }
#key i { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border-radius: 3px; }
#tabs { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; }
#tabs a { padding: 8px 16px; font: 600 16px 'Cinzel', serif; color: #f3ead6; text-decoration: none; background: #0d1422e0; border: 1px solid #c38d4688; border-radius: 8px; }
#tabs a.on { background: #c38d46; color: #101825; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="label"></div>
<div id="key">
  <div><i style="background:#ff6b57"></i>Hollow Toll ring, 2.6–6.8 m</div>
  <div><i style="background:#ffb36b"></i>Bell Sweep cone, 80° × 8 m</div>
  <div><i style="background:#ff8fb0"></i>Pendulum Charge lane, 2.2 m</div>
  <div><i style="background:#c9a7ff"></i>Shattered Chime, 1.4 m, one per player</div>
  <div><i style="background:#9fe8ff"></i>Dash length, 3.75 m</div>
</div>
<div id="tabs"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
// Arena size study for 8 players: every shape is drawn at the Bellkeeper v1.0 sizes (design reference §3), 1 unit = 1 m.
// ?size=a|b|c picks the option. Players are 1.5 m tall, as in index.html.
import * as THREE from 'three';

const OPTIONS = {
  a: { title: 'A · Current dais', shape: 'rect', w: 20.5, d: 15, boss: [0, -2.75],
       notes: ['20.5 × 15 m rectangle, boss 5.5 m from the back wall', 'The Toll ring runs past the back wall', 'Only 1.2 m clear in front of the ring for 8 players'] },
  b: { title: 'B · Round dais, 24 m', shape: 'round', r: 12, boss: [0, 0],
       notes: ['24 m across, boss in the centre', '5.2 m clear outside the Toll ring, about 1.4 dashes', 'Fits on screen with room for the HUD'] },
  c: { title: 'C · Round dais, 30 m', shape: 'round', r: 15, boss: [0, 0],
       notes: ['30 m across, boss in the centre', '8.2 m clear outside the Toll ring, about 2 dashes', 'Characters get small on screen'] },
};
const key = new URLSearchParams(location.search).get('size') || 'b', O = OPTIONS[key] || OPTIONS.b;
document.getElementById('label').innerHTML = `<h1>${O.title}</h1><ul>${O.notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
document.getElementById('tabs').innerHTML = Object.keys(OPTIONS).map(k => `<a href="?size=${k}" class="${k === key ? 'on' : ''}">${k.toUpperCase()}</a>`).join('');

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3b3566); scene.fog = new THREE.Fog(0x3b3566, 40, 110);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0x9aa7e0, 0x2a2350, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b0, 1.6); sun.position.set(-10, 22, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); scene.add(sun);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
const flat = (c, op) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
function add(geo, m, pos = [0, 0, 0], rotX = 0) { const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.x = rotX; scene.add(o); return o; }
const onFloor = (geo, m, x, z, y = 0.02) => add(geo, m, [x, y, z], -Math.PI / 2);

// floor, curb, 1 m grid so distances can be read off the picture
const floorM = mat(0x2d4663), curbM = mat(0xd9ccb0), brassM = mat(0xc38d46, { metalness: 0.4 });
let half; // half-extent used for camera framing
if (O.shape === 'rect') {
  add(new THREE.BoxGeometry(O.w, 0.4, O.d), floorM, [0, -0.2, 0]).receiveShadow = true;
  add(new THREE.BoxGeometry(O.w + 2, 0.5, O.d + 2), curbM, [0, -0.3, 0]);
  half = Math.max(O.w, O.d * 1.35) / 2;
} else {
  add(new THREE.CylinderGeometry(O.r, O.r, 0.4, 96), floorM, [0, -0.2, 0]).receiveShadow = true;
  add(new THREE.CylinderGeometry(O.r + 1, O.r + 1.3, 0.5, 96), curbM, [0, -0.3, 0]);
  onFloor(new THREE.RingGeometry(O.r - 0.12, O.r, 96), brassM, 0, 0, 0.01);
  half = O.r * 1.08;
}
const grid = new THREE.GridHelper(40, 40, 0x5a7aa0, 0x3f5878); grid.material.transparent = true; grid.material.opacity = 0.35; grid.position.y = 0.005; scene.add(grid);
const clip = O.shape === 'rect' ? null : O.r;
grid.material.onBeforeCompile = s => { // hide grid lines off the dais
  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;').replace('#include <project_vertex>', '#include <project_vertex>\nvW = (modelMatrix * vec4(position,1.)).xyz;');
  s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;').replace('void main() {', `void main() { ${clip ? `if (length(vW.xz) > ${clip.toFixed(2)}) discard;` : `if (abs(vW.x) > ${(O.w / 2).toFixed(2)} || abs(vW.z) > ${(O.d / 2).toFixed(2)}) discard;`}`);
};

// the boss: 1.4 m body radius (BOSS_BODY = 56 units), about 5 m tall
const [bx, bz] = O.boss;
add(new THREE.CylinderGeometry(1.0, 1.4, 3.2, 24), mat(0xc38d46, { metalness: 0.5 }), [bx, 1.6, bz]).castShadow = true;
add(new THREE.SphereGeometry(0.9, 24, 12), mat(0xc38d46, { metalness: 0.5 }), [bx, 3.6, bz]).castShadow = true;
add(new THREE.SphereGeometry(0.22, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffe9a8 }), [bx, 3.7, bz + 0.8]);

// attack shapes
onFloor(new THREE.RingGeometry(2.6, 6.8, 96), flat(0xff6b57, 0.32), bx, bz);
for (const r of [2.6, 6.8]) onFloor(new THREE.RingGeometry(r - 0.06, r + 0.06, 96), flat(0xff6b57, 0.95), bx, bz, 0.03);
const sweep = onFloor(new THREE.CircleGeometry(8, 48, Math.PI / 2 - 0.698 + Math.PI, 1.396), flat(0xffb36b, 0.22), bx, bz, 0.025);
sweep.rotation.z = Math.PI * 0.75; // aimed toward the lower left
const laneLen = O.shape === 'rect' ? 8 : O.r - 1.2, laneAng = -0.55;
const lane = onFloor(new THREE.PlaneGeometry(2.2, laneLen), flat(0xff8fb0, 0.3), bx + Math.sin(laneAng) * laneLen / 2, bz - Math.cos(laneAng) * laneLen / 2, 0.028);
lane.rotation.z = laneAng;

// 8 players spread around the boss outside the Toll ring (or as far as the dais allows), each with a chime marker
const COLORS = [0x3d7bff, 0x55c9ce, 0xf6c968, 0xf3ead6, 0x9b7bff, 0x7fdc8a, 0xff9a6b, 0xff7fbf];
for (let i = 0; i < 8; i++) {
  const a = (i + 0.5) / 8 * Math.PI * 2;
  let r = 8.6, x = bx + Math.sin(a) * r, z = bz + Math.cos(a) * r;
  if (O.shape === 'rect') { x = THREE.MathUtils.clamp(x, -O.w / 2 + 0.8, O.w / 2 - 0.8); z = THREE.MathUtils.clamp(z, -O.d / 2 + 0.8, O.d / 2 - 0.8); }
  else { const l = Math.hypot(x, z), m = O.r - 0.9; if (l > m) { x *= m / l; z *= m / l; } }
  const p = add(new THREE.CapsuleGeometry(0.32, 0.86, 4, 12), mat(COLORS[i]), [x, 0.75, z]); p.castShadow = true;
  onFloor(new THREE.CircleGeometry(1.4, 40), flat(0xc9a7ff, 0.22), x, z, 0.035);
  onFloor(new THREE.RingGeometry(1.34, 1.4, 40), flat(0xc9a7ff, 0.9), x, z, 0.04);
  if (i === 2) { // one dash arrow for scale
    const d = add(new THREE.PlaneGeometry(0.25, 3.75), flat(0x9fe8ff, 0.85), [0, 0.05, 0], -Math.PI / 2);
    const dirA = a + Math.PI / 2; d.position.set(x + Math.sin(dirA) * 1.9, 0.05, z + Math.cos(dirA) * 1.9); d.rotation.z = -dirA;
  }
}

// same angle as index.html (CAM_BASE 0,21,18.5 looking at 0,0,2.4), pulled back to fit the dais
const dir = new THREE.Vector3(0, 21, 16.1).normalize();
function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  const vfov = THREE.MathUtils.degToRad(camera.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const dist = Math.max(half / Math.tan(vfov / 2) * 0.82, half / Math.tan(hfov / 2) * 1.05) + 4;
  camera.position.copy(dir).multiplyScalar(dist); camera.lookAt(0, 0, 0.6); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
