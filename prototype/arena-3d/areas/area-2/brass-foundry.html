<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass Foundry Look</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0b07; }
canvas { display: block; }
#vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, #0c040288 100%); }
#tabs { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; font-family: Georgia, serif; }
#tabs a { padding: 7px 14px; font-size: 15px; color: #f3ead6; text-decoration: none; background: #140a06e0; border: 1px solid #c3783e88; border-radius: 8px; }
#tabs a.on { background: #c3783e; color: #140a06; }
body.clean #tabs { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas><div id="vig"></div>
<div id="tabs"><a href="?view=game">Game camera</a><a href="?view=game&tele">With a telegraph</a><a href="?view=hero">Reference angle</a><a href="?view=top">Top view</a></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// Look study for Area 2, The Brass Foundry (foundry-env.js). ?view=game uses the Bellkeeper arena's gameplay camera,
// ?view=hero copies the reference board's main painting, ?view=top its top view, ?tele drops a sample attack telegraph on the floor to check
// that decoration stays quieter than attacks, ?spawns marks eight player spots, ?clean hides the tabs.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search), VIEW = Q.get('view') || 'game';
if (Q.has('clean')) document.body.classList.add('clean');
document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.search === location.search || (!location.search && a.search === '?view=game')));
const loadScript = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); });

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 1200);
window.THREE = THREE;
await loadScript('foundry-env.js');
const env = window.buildFoundryEnv(THREE, scene);

// ---- the Vanguard for scale (characters session's model, loaded read-only) ----
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: o.metal ? 0.4 : 0.75, metalness: o.metal ? 0.7 : 0, side: o.side || THREE.FrontSide });
const Gl = (c, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), toneMapped: false });
const hero = new THREE.Group(); hero.position.set(-3.5, 0, 5.5); hero.rotation.y = Math.PI * 0.8; scene.add(hero);
await loadScript('../../vanguard-model.js');
if (typeof window.buildVanguardModel === 'function') { const v = window.buildVanguardModel(M, Gl); const obj = v.root || v; obj.scale.setScalar(1.2); obj.traverse(o => { if (o.isMesh) o.castShadow = true; }); hero.add(obj); }
else { const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1, 4, 12), M(0x2050cc)); c.position.y = 0.85; hero.add(c); }

// ---- sample telegraph: a coral-red danger disc with a bright edge, like the reference's in-game panel ----
let tele = null;
if (Q.has('tele')) {
  tele = new THREE.Group(); tele.position.set(5.5, 0.04, -2.5); scene.add(tele);
  const fill = new THREE.Mesh(new THREE.CircleGeometry(4, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xff4a1e, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  const edge = new THREE.Mesh(new THREE.RingGeometry(3.82, 4, 96).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff6a3a).multiplyScalar(2), transparent: true, opacity: 0.95, depthWrite: false, toneMapped: false }));
  tele.add(fill, edge); tele.userData = { fill, edge };
}
// ---- eight player spots on a 10 m ring (sizing check for co-op) ----
if (Q.has('spawns')) for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2 + Math.PI / 8, m = new THREE.Mesh(new THREE.RingGeometry(0.45, 0.6, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x7ad8ff, toneMapped: false }));
  m.position.set(Math.cos(a) * 10, 0.05, Math.sin(a) * 10); scene.add(m);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.55, 0.88));
composer.addPass(new OutputPass());

function frame() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h;
  if (VIEW === 'hero' || VIEW === 'angle') { camera.fov = 40; camera.position.set(-17, 34, 34); camera.lookAt(1, -4, -1); }
  else if (VIEW === 'top') { camera.fov = 40; camera.position.set(0, 80, 0.01); camera.lookAt(0, 0, 0); }
  else { camera.fov = 44; camera.position.set(0, 29, 22.5); camera.lookAt(0, 0, 1.0); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame); frame();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (renderer.domElement.width !== Math.floor(innerWidth * renderer.getPixelRatio())) frame();
  env.update(t, dt, !!tele);
  if (tele) { const p = 0.5 + 0.5 * Math.sin(t * 5); tele.userData.fill.material.opacity = 0.24 + 0.14 * p; }
  composer.render();
});
</script>
</body>
</html>
